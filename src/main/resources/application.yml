server:
  port: 8037
  error:
    include-message: "always"
    include-binding-errors: "always"

spring:
  application:
    name: "hexagonal-loan-service"

  datasource:
    url: "jdbc:postgresql://localhost:9091/loan_db"
    username: "jcvidal"
    password: "123456"
    driver-class-name: "org.postgresql.Driver"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "create"
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 25

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    default-property-inclusion: "non_null"

logging:
  level:
    root: "INFO"
    com.jorgeluis.mascotienda: "DEBUG"