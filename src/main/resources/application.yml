server:
  port: 8080
  error:
    include-message: "always"
    include-binding-errors: "always"

spring:
  application:
    name: "hexagonal-loan-service"

  datasource:
    url: "jdbc:postgresql://localhost:5432/loan_db"
    username: "your_user"
    password: "your_password"
    driver-class-name: "org.postgresql.Driver"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "update"
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 25

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: "non_null"

logging:
  level:
    root: "INFO"
    com.jorgeluis.mascotienda: "DEBUG"